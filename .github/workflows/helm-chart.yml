name: Build And Publish Helm Chart

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  lint-package-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint charts/markdown-live-preview

      - name: Package chart
        run: mkdir -p .artifacts && helm package charts/markdown-live-preview --destination .artifacts

      - name: Log in to GHCR for OCI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push chart to GHCR OCI
        run: |
          chart_file="$(ls .artifacts/*.tgz)"
          owner_lc="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          helm push "${chart_file}" "oci://ghcr.io/${owner_lc}/helm-charts"
